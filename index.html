<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#17191c">
<meta name="description" content="Бесплатный видеоредактор: монтаж, титры, ключевые кадры, экспорт MP4. Работает без интернета.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Склейка">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>#app{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Склейка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600&family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;800&family=Rubik:wght@400;700&family=Oswald:wght@500;700&family=Lobster&family=Pacifico&display=swap">
<style>
/* Layout: cutting room. Menu bar; media/properties panel left, program monitor right; timeline band across the bottom. Single deliberate dark theme (video work is judged on dark surround). */
:root{
  --bg:#17191c; --panel:#1f2226; --raised:#2a2e33; --line:#353a40; --fg:#e6e4df; --muted:#979ca3;
  --accent:#5cc6c4; --accent-ink:#0f2a2a; --well:#0e0f11; --danger:#ea6b5c;
  --c-model:#8a4f5e; --c-video:#35577f; --c-audio:#2c6656; --c-text:#674c8c; --c-image:#7d6236; --c-solid:#525861;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --tlh:40%;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.35 var(--f-ui);overflow:hidden;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
kbd{font:500 11px/1 var(--f-mono);background:var(--raised);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:3px 5px;white-space:nowrap}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 6px var(--tlh);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#menubar{display:flex;align-items:center;gap:6px;height:42px;border-bottom:1px solid var(--line);min-width:0}
.logo{font:600 15px/1 var(--f-display);padding-right:10px;white-space:nowrap}
.logo span{color:var(--accent)}
#menus{display:flex;gap:2px;overflow-x:auto;min-width:0;scrollbar-width:none}
#menus::-webkit-scrollbar{display:none}
.mbtn{background:none;border:0;padding:6px 9px;border-radius:5px;white-space:nowrap}
.mbtn:hover,.mbtn.open{background:var(--raised)}
.spacer{flex:1}
.cta{display:flex;gap:6px;flex-shrink:0}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:5px 11px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.small{padding:3px 8px;font-size:12px}
.btn.ghost{background:none}
#panelBtn{display:none}
.dropdown{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px;min-width:280px;box-shadow:0 12px 32px rgba(0,0,0,.5);max-height:80vh;overflow-y:auto}
.dropdown button{display:flex;width:100%;justify-content:space-between;gap:18px;align-items:center;background:none;border:0;padding:6px 9px;border-radius:5px;text-align:left}
.dropdown button:hover{background:var(--raised)}
.dropdown hr{border:0;border-top:1px solid var(--line);margin:5px 4px}

#main{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:0;position:relative}
#side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.tabs{display:flex;gap:2px;padding:8px 10px 0 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 8px;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabpane{flex:1;overflow-y:auto;min-height:0;padding:10px 12px 14px 0}
.binbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#bin{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#bin li{display:flex;align-items:center;gap:10px;padding:5px;border-radius:7px;border:1px solid transparent;cursor:grab;touch-action:pan-y}
#bin li:hover{background:var(--panel);border-color:var(--line)}
.bthumb{width:64px;height:36px;border-radius:4px;background:#000 center/cover no-repeat;flex-shrink:0;display:grid;place-items:center;color:var(--muted)}
.bthumb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7}
.bmeta{flex:1;min-width:0}
.bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bsub{font:11px var(--f-mono);color:var(--muted)}
.ibtn{background:var(--raised);border:1px solid var(--line);border-radius:5px;width:26px;height:26px;display:grid;place-items:center;padding:0;flex-shrink:0}
.ibtn:hover{border-color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;color:var(--muted)}
.empty b{color:var(--fg);font-weight:600}

#insp h3{margin:14px 0 8px;font:600 11px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#insp h3:first-child{margin-top:4px}
.ihead{display:flex;gap:8px;align-items:center}
.ihead input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 7px}
.badge{font:600 10px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:4px 6px;border-radius:4px;color:#fff}
.b-model{background:var(--c-model)}.b-video{background:var(--c-video)}.b-audio{background:var(--c-audio)}.b-text{background:var(--c-text)}.b-image{background:var(--c-image)}.b-solid{background:var(--c-solid)}
.iinfo{font:11.5px var(--f-mono);color:var(--muted);margin-top:6px}
.irow{display:grid;grid-template-columns:96px minmax(0,1fr) 62px 24px;gap:6px;align-items:center;margin-bottom:5px}
.irow.nokf{grid-template-columns:96px minmax(0,1fr) 62px}
.irow label{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow input[type=range]{width:100%;accent-color:var(--accent);min-width:0}
.irow input.num{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 4px;font:12px var(--f-mono)}
.kf{background:none;border:1px solid transparent;border-radius:4px;color:var(--muted);font-size:12px;padding:2px 0;width:24px}
.kf.anim{color:var(--accent)}
.kf.on{background:var(--accent);color:var(--accent-ink)}
.frow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px;align-items:center;margin-bottom:6px}
.frow label{color:var(--muted);font-size:12px}
.frow select,.frow textarea,.frow input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.frow textarea{resize:vertical;min-height:54px}
.frow input[type=color]{width:42px;height:26px;border:1px solid var(--line);border-radius:5px;background:none;padding:1px}
.chk{display:flex;align-items:center;gap:6px}
.chk input{accent-color:var(--accent)}
.ibtns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}

#viewer{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--well)}
#pvbox{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;touch-action:none}
#pv{display:block;background:#000;box-shadow:0 0 0 1px #000,0 8px 30px rgba(0,0,0,.6)}
#pvov{position:absolute;pointer-events:none}
#transport{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.tc{font:500 14px var(--f-mono);color:var(--accent);min-width:110px}
.tcdur{font:12px var(--f-mono);color:var(--muted)}
.tbtn{background:none;border:0;width:32px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--fg)}
.tbtn:hover{background:var(--raised)}
.tbtn svg{width:18px;height:18px;fill:currentColor}
.tbtn.play{background:var(--raised)}
#fmtLbl{font:11px var(--f-mono);color:var(--muted);margin-left:auto}

#split{cursor:row-resize;background:var(--line);margin:2px 0;border-radius:3px;touch-action:none}
#split:hover{background:var(--muted)}
#tl{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
#tlbar{display:flex;align-items:center;gap:6px;padding:4px 0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#tlbar::-webkit-scrollbar{display:none}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-shrink:0}
.seg button{background:none;border:0;padding:3px 9px;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--raised);color:var(--fg)}
.tlsep{width:1px;height:20px;background:var(--line);flex-shrink:0}
#tlscroll{flex:1;overflow:auto;position:relative;min-height:0;border:1px solid var(--line);border-radius:8px;background:var(--well)}
#tlinner{position:relative;min-height:100%}
.rrow{position:sticky;top:0;z-index:6;display:flex;height:26px;background:var(--panel);border-bottom:1px solid var(--line)}
.corner{position:sticky;left:0;z-index:7;width:168px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;padding-left:10px;font:11px var(--f-mono);color:var(--muted)}
#ruler{position:sticky;left:168px;display:block;cursor:pointer}
.trow{display:flex;border-bottom:1px solid #22262b}
.thead{position:sticky;left:0;z-index:5;width:168px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 6px 0 10px}
.tname{font:600 12px var(--f-mono);flex:1}
.tname small{font:400 11px var(--f-ui);color:var(--muted);margin-left:6px}
.tb{background:none;border:0;width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--muted);padding:0}
.tb:hover{background:var(--raised);color:var(--fg)}
.tb.on{color:var(--danger)}
.tb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lane{position:relative;flex-shrink:0}
.trow.video .lane{background:repeating-linear-gradient(90deg,transparent 0 99px,rgba(255,255,255,.02) 99px 100px)}
.trow.locked .lane{background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px)}
.trow.drop .lane{background:rgba(92,198,196,.08)}
.clip{position:absolute;top:3px;bottom:3px;border-radius:5px;overflow:hidden;cursor:grab;border:1px solid rgba(255,255,255,.12);background-repeat:repeat-x;background-size:auto 100%;touch-action:none;user-select:none}
.clip.t-model{background-color:var(--c-model)}.clip.t-video{background-color:var(--c-video)}.clip.t-audio{background-color:var(--c-audio)}.clip.t-text{background-color:var(--c-text)}.clip.t-image{background-color:var(--c-image)}.clip.t-solid{background-color:var(--c-solid)}
.clip::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 60%);pointer-events:none}
.clip.sel{border:2px solid var(--accent);box-shadow:0 0 0 1px #000}
.cname{position:absolute;left:7px;top:3px;right:7px;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none}
.wave{position:absolute;left:0;bottom:0;pointer-events:none;opacity:.85}
.kfm{position:absolute;bottom:3px;width:7px;height:7px;background:var(--accent);transform:translateX(-50%) rotate(45deg);pointer-events:none;box-shadow:0 0 0 1px #000}
.h{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:2}
.h.l{left:0}.h.r{right:0}
.clip:hover .h{background:rgba(255,255,255,.18)}
#tl.razor .clip{cursor:crosshair}
#ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);z-index:8;pointer-events:none}
#ph::before{content:"";position:absolute;top:0;left:-6px;border:7px solid transparent;border-top:9px solid var(--accent)}

#tip{position:fixed;z-index:60;background:#0b0c0e;border:1px solid var(--line);border-radius:7px;padding:7px 10px;max-width:280px;pointer-events:none;font-size:12px}
#modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(420px,100%);padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto}
.dlg h3{margin:0;font:600 15px/1.2 var(--f-display)}
.dlg p{margin:0;color:var(--muted);font-size:12.5px}
.dbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.pbar{height:8px;border-radius:4px;background:var(--well);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent)}
#keys{position:fixed;inset:0;z-index:80;background:rgba(9,10,11,.88);overflow-y:auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.keys-in{max-width:1100px;margin:0 auto}
.keys-top{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.keys-top h2{margin:0;font:600 20px/1.2 var(--f-display);flex:1}
.keys-top input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:220px;max-width:100%}
.kgrid{columns:3 300px;column-gap:28px}
.kgroup{break-inside:avoid;margin-bottom:22px}
.kgroup h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.krow{display:flex;justify-content:space-between;gap:14px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:90;background:#0b0c0e;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:9px 14px;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.5)}
#dropAll{position:fixed;inset:12px;z-index:65;border:2px dashed var(--accent);border-radius:14px;background:rgba(14,15,17,.85);display:grid;place-items:center;font-size:17px;pointer-events:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0}

/* libraries */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ttile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;cursor:grab;text-align:left;min-width:0}
.ttile:hover{border-color:var(--accent)}
.ttile canvas{width:100%;aspect-ratio:16/9;border-radius:5px;display:block;background:#000}
.ttile span{font-size:12px}
.trans{position:absolute;top:50%;height:22px;margin-top:-11px;border-radius:5px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.92) 0 6px,rgba(220,240,240,.7) 6px 12px);border:1px solid #000;z-index:3;cursor:pointer;color:#10272a;font:600 10px/20px var(--f-ui);text-align:center;overflow:hidden;white-space:nowrap;padding:0 4px}
.trans.sel{outline:2px solid var(--accent);outline-offset:1px}
.flist{display:flex;flex-direction:column;gap:2px}
.fitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;border:1px solid transparent;background:none;text-align:left;width:100%;min-width:0}
.fitem:hover{background:var(--panel);border-color:var(--line)}
.fitem.on{border-color:var(--accent);background:var(--panel)}
.fitem .fs{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.fitem small{color:var(--muted);font-size:11px;flex-shrink:0;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcats{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.fcats button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--muted)}
.fcats button.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.fontbtn{width:100%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
@media (max-width:860px){
  #main{grid-template-columns:minmax(0,1fr)}
  #side{position:absolute;left:0;top:0;bottom:0;width:min(330px,88%);z-index:30;display:none;box-shadow:10px 0 30px rgba(0,0,0,.5);padding-left:12px}
  #app.showside #side{display:flex}
  #panelBtn{display:inline-block}
  .helpk,#fmtLbl{display:none}
  :root{--tlh:44%}
}
@media (max-width:560px){.logo,#helpBtn{display:none}.cta .btn{padding:5px 9px}.corner,.thead{width:104px}#ruler{left:104px}.tname small{display:none}}
</style>

</head>
<body>
<div id="app">
  <header id="menubar">
    <div class="logo">Скле<span>й</span>ка</div>
    <nav id="menus" aria-label="Меню"></nav>
    <div class="spacer"></div>
    <div class="cta">
      <button class="btn ghost" id="helpBtn" type="button">Клавиши <kbd class="helpk">F1</kbd></button>
      <button class="btn" id="panelBtn" type="button">Панель</button>
      <button class="btn" id="importBtn" type="button">Импорт</button>
      <button class="btn primary" id="exportBtn" type="button">Экспорт</button>
      <button class="btn primary" id="installBtn" type="button" hidden>Установить</button>
    </div>
  </header>
  <main id="main">
    <aside id="side">
      <div class="tabs" role="tablist"><button type="button" id="tabMedia" class="on">Медиа</button><button type="button" id="tabTrans">Переходы</button><button type="button" id="tabFonts">Шрифты</button><button type="button" id="tabProps">Свойства</button></div>
      <div class="tabpane" id="paneMedia">
        <div class="binbar">
          <button class="btn small" type="button" id="binImport">+ Файлы</button>
          <button class="btn small" type="button" id="binText">+ Текст</button>
          <button class="btn small" type="button" id="binSolid">+ Фон</button>
          <button class="btn small" type="button" id="bin3d">+ 3D</button>
        </div>
        <ul id="bin"></ul>
      </div>
      <div class="tabpane" id="paneTrans" hidden><p class="note" style="margin:0 0 10px">Перетащите переход на стык двух клипов — или выберите клип и нажмите на переход. Наведите, чтобы увидеть, как он выглядит.</p><div class="tgrid" id="tgrid"></div></div>
      <div class="tabpane" id="paneFonts" hidden><input class="search" id="fsearch" placeholder="Найти шрифт" aria-label="Найти шрифт"><div class="fcats" id="fcats"></div><div class="binbar"><button class="btn small" type="button" id="fontUp">+ Свой шрифт (.ttf .otf .woff)</button></div><div class="flist" id="flist"></div></div>
      <div class="tabpane" id="paneProps" hidden><div id="insp"></div></div>
    </aside>
    <section id="viewer">
      <div id="pvbox"><canvas id="pv"></canvas><canvas id="pvov"></canvas></div>
      <div id="transport">
        <span class="tc" id="tc">00:00:00:00</span>
        <button class="tbtn" type="button" id="bStart" title="В начало (Home)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="tbtn" type="button" id="bPrev" title="Кадр назад (←)"><svg viewBox="0 0 24 24"><path d="M15 6v12L7 12z"/></svg></button>
        <button class="tbtn play" type="button" id="bPlay" title="Пуск / пауза (Пробел)"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 5v14l12-7z"/></svg></button>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
const fmtKey=k=>k.replace(/Ctrl/g,isMac?'⌘':'Ctrl').replace(/Alt/g,isMac?'⌥':'Alt');
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(v==null)continue;if(k==='on')for(const ev in v)e.addEventListener(ev,v[ev]);else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v);}kids.flat().forEach(k=>k!=null&&e.append(k));return e;}
const nid=p=>p+Math.random().toString(36).slice(2,10);
let toastT=0;function toast(msg,ms=3200){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);}

/* ================= state ================= */
const P={w:1920,h:1080,fps:30,bg:'#000000',demo:false,tracks:[],clips:[]};
const MEDIA=new Map();
const MODELS=new Map();
const D2R=Math.PI/180;
const SEL=new Set();
let T=0, PPS=60, SNAP=true, tool='select';
const fr=t=>Math.round(t*P.fps)/P.fps;
const EPS=1e-6;
const isAV=c=>c.type==='video'||c.type==='audio';
const isVisual=c=>c.type!=='audio';
const trackOf=id=>P.tracks.find(t=>t.id===id);
const projEnd=()=>P.clips.reduce((m,c)=>Math.max(m,c.start+c.dur),0);
function tc(t){t=Math.max(0,t);const f=Math.floor(t*P.fps+1e-6),ff=f%P.fps,s=Math.floor(f/P.fps),p=n=>String(n).padStart(2,'0');return `${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}:${p(ff)}`;}
function defTracks(){return[{id:'v3',name:'V3',kind:'video'},{id:'v2',name:'V2',kind:'video'},{id:'v1',name:'V1',kind:'video'},{id:'a1',name:'A1',kind:'audio'},{id:'a2',name:'A2',kind:'audio'}].map(t=>({...t,mute:false,hide:false,lock:false}));}
function defP(type){
  const p={x:0,y:0,scale:1,rot:0,opacity:1,volume:1,fadeIn:0,fadeOut:0,bright:100,contrast:100,sat:100,blur:0,anim:'none'};
  if(type==='text')Object.assign(p,{text:'Ваш текст',font:'Montserrat',size:110,color:'#ffffff',bold:true,outline:true,oc:'#111111',ow:8,bg:false,bgc:'#000000',bga:.55,align:'center',anim:'pop'});
  if(type==='solid')Object.assign(p,{fill:'#22304d',fill2:'#b8577a',grad:true,angle:135});
  if(type==='model')Object.assign(p,{prim:'',rx:15,ry:-25,spin:24,dist:1,light:1,mcolor:'#5cc6c4',metal:.35,rough:.3,animOn:true,animIdx:0,anim:'fade'});
  return p;
}
function makeClip(type,track,start,dur,m){return{id:nid('c'),type,track,start:fr(start),dur:fr(dur),in:0,speed:1,media:m?m.id:null,name:m?m.name:(type==='text'?'Текст':type==='model'?'3D':'Фон'),p:defP(type),kf:{}};}
const maxDur=c=>{if(!isAV(c))return Infinity;const m=MEDIA.get(c.media);return m?(m.dur-c.in)/c.speed:Infinity;};

/* keyframes */
const KFTOL=()=>0.5/P.fps;
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function val(c,k,lt){const a=c.kf&&c.kf[k];if(!a||!a.length)return c.p[k];if(lt<=a[0][0])return a[0][1];const l=a[a.length-1];if(lt>=l[0])return l[1];for(let i=0;i<a.length-1;i++){const A=a[i],B=a[i+1];if(lt>=A[0]&&lt<=B[0]){const u=(lt-A[0])/(B[0]-A[0]||1);return A[1]+(B[1]-A[1])*ease(u);}}return l[1];}
const ltOf=c=>clamp(fr(T-c.start),0,c.dur);
function setProp(c,k,v){const a=c.kf[k];if(a&&a.length){const lt=ltOf(c),i=a.findIndex(q=>Math.abs(q[0]-lt)<KFTOL());if(i>=0)a[i][1]=v;else{a.push([lt,v]);a.sort((x,y)=>x[0]-y[0]);}}else c.p[k]=v;}
function hasKfAt(c,k){const a=c.kf[k];if(!a)return false;const lt=ltOf(c);return a.some(q=>Math.abs(q[0]-lt)<KFTOL());}
function toggleKf(c,k){const lt=ltOf(c);const a=c.kf[k]||[];const i=a.findIndex(q=>Math.abs(q[0]-lt)<KFTOL());
  if(i>=0){const v=val(c,k,lt);a.splice(i,1);if(!a.length){delete c.kf[k];c.p[k]=v;}}
  else{a.push([lt,val(c,k,lt)]);a.sort((x,y)=>x[0]-y[0]);c.kf[k]=a;}}
function shiftKf(c,d){for(const k in c.kf)c.kf[k]=c.kf[k].map(([t,v])=>[fr(t+d),v]);}

/* edit primitives */
function splitAt(c,t){const lt=fr(t-c.start);if(lt<=EPS||lt>=c.dur-EPS)return null;
  const r=JSON.parse(JSON.stringify(c));r.id=nid('c');r.start=fr(c.start+lt);r.dur=fr(c.dur-lt);if(isAV(c))r.in=c.in+lt*c.speed;shiftKf(r,-lt);r.p.fadeIn=0;r.p.anim='none';r.tin=null;
  c.dur=lt;c.p.fadeOut=0;P.clips.push(r);return r;}
function trimLeft(c,d){c.start=fr(c.start+d);if(isAV(c))c.in+=d*c.speed;c.dur=fr(c.dur-d);shiftKf(c,-d);}
function clearRange(tid,a,b,ex){for(const c of[...P.clips]){if(c.track!==tid||ex.has(c.id))continue;const s=c.start,e=c.start+c.dur;if(e<=a+EPS||s>=b-EPS)continue;
  if(s>=a-EPS&&e<=b+EPS)P.clips.splice(P.clips.indexOf(c),1);
  else if(s<a&&e>b){splitAt(c,b);c.dur=fr(a-s);}
  else if(s<a)c.dur=fr(a-s);
  else trimLeft(c,b-s);}}
function freeTrack(kind,a,b,bottomUp){const ts=P.tracks.filter(t=>t.kind===kind&&!t.lock);if(bottomUp)ts.reverse();
  for(const t of ts)if(!P.clips.some(c=>c.track===t.id&&c.start<b-EPS&&c.start+c.dur>a+EPS))return t.id;return addTrack(kind,true);}
function addTrack(kind,silent){const n=P.tracks.filter(t=>t.kind===kind).length+1,pre=kind==='video'?'V':'A';let name=pre+n;while(P.tracks.some(t=>t.name===name))name=pre+(parseInt(name.slice(1))+1);
  const t={id:nid('t'),name,kind,mute:false,hide:false,lock:false};if(kind==='video')P.tracks.unshift(t);else P.tracks.push(t);if(!silent){snap('Новая дорожка');renderTimeline();}return t.id;}

/* ================= history & autosave ================= */
const H={stack:[],i:-1};
function snap(label){H.stack=H.stack.slice(0,H.i+1);H.stack.push({label,s:JSON.stringify(P)});if(H.stack.length>120)H.stack.shift();H.i=H.stack.length-1;scheduleSave();}
function restoreState(s){const o=JSON.parse(s);Object.assign(P,o);for(const id of[...SEL])if(!P.clips.some(c=>c.id===id))SEL.delete(id);applyFormat(false);gcEls();renderAll();}
function undo(){if(H.i>0){const l=H.stack[H.i].label;H.i--;restoreState(H.stack[H.i].s);toast('Отменено: '+l,1300);}}
function redo(){if(H.i<H.stack.length-1){H.i++;restoreState(H.stack[H.i].s);toast('Повторено: '+H.stack[H.i].label,1300);}}

let DBP=null;
function idb(){if(DBP)return DBP;DBP=new Promise((res,rej)=>{try{const r=indexedDB.open('skleika',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:'id'});if(!d.objectStoreNames.contains('fonts'))d.createObjectStore('fonts',{keyPath:'name'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});DBP.catch(()=>{});return DBP;}
async function idbDo(store,mode,fn){const d=await idb();return new Promise((res,rej)=>{const tx=d.transaction(store,mode),st=tx.objectStore(store);let out;const r=fn(st);if(r)r.onsuccess=()=>out=r.result;tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
const idbPut=(s,v,k)=>idbDo(s,'readwrite',st=>k===undefined?st.put(v):st.put(v,k)).catch(()=>{});
const idbGet=(s,k)=>idbDo(s,'readonly',st=>st.get(k)).catch(()=>null);
const idbAll=s=>idbDo(s,'readonly',st=>st.getAll()).catch(()=>[]);
const idbClear=s=>idbDo(s,'readwrite',st=>st.clear()).catch(()=>{});
let saveT=0;function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(()=>idbPut('kv',{v:1,P:JSON.stringify(P),at:Date.now()},'project'),700);}
const mediaRecord=m=>({id:m.id,name:m.name,kind:m.kind,blob:m.blob,dur:m.dur,w:m.w,h:m.h,thumb:m.thumb,peaks:m.peaks||null,noAudio:!!m.noAudio});

/* ================= audio ================= */
let AC=null,MASTER=null;
function ensureAC(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.connect(AC.destination);}catch(e){return null;}}if(AC.state==='suspended')AC.resume().catch(()=>{});for(const r of ELS.values())connectEl(r);return AC;}
const ELS=new Map();
function elFor(c){const m=MEDIA.get(c.media);if(!m||m.kind==='image')return null;let r=ELS.get(c.id);if(r&&r.mid===m.id)return r;if(r)dropEl(c.id);
  const e=document.createElement(m.kind==='audio'?'audio':'video');e.preload='auto';e.playsInline=true;e.setAttribute('playsinline','');e.src=m.url;r={el:e,mid:m.id,src:null,g:null};ELS.set(c.id,r);if(AC)connectEl(r);return r;}
function connectEl(r){if(r.src||!AC)return;try{r.src=AC.createMediaElementSource(r.el);r.g=AC.createGain();r.src.connect(r.g);r.g.connect(MASTER);}catch(e){}}
function dropEl(id){const r=ELS.get(id);if(!r)return;try{r.el.pause();r.src&&r.src.disconnect();r.g&&r.g.disconnect();r.el.removeAttribute('src');r.el.load();}catch(e){}ELS.delete(id);}
function gcEls(){for(const id of[...ELS.keys()])if(!P.clips.some(c=>c.id===id))dropEl(id);for(const id of[...MODELS.keys()])if(!P.clips.some(c=>c.id===id))MODELS.delete(id);}
const srcT=(c,t)=>{const m=MEDIA.get(c.media);return clamp(c.in+(t-c.start)*c.speed,0,Math.max(0,(m?m.dur:1e9)-0.03));};
const fadeK=(c,lt)=>clamp(Math.min(c.p.fadeIn>0?lt/c.p.fadeIn:1,c.p.fadeOut>0?(c.dur-lt)/c.p.fadeOut:1),0,1);

/* ================= playback ================= */
let playing=false,rate=1,wall0=0,T00=0,exporting=null;
function play(r=1){ensureAC();if(r>0&&T>=projEnd()-1/P.fps)T=0;rate=r;playing=true;wall0=performance.now();T00=T;syncMedia();requestAnimationFrame(tick);updPlayBtn();}
function pause(){if(!playing)return;playing=false;rate=1;for(const r of ELS.values())if(!r.el.paused)r.el.pause();T=fr(T);updPlayBtn();renderStill();updPH();refreshInsp();}
function togglePlay(){playing?pause():play(1);}
function tick(now){
  if(!playing)return;
  T=T00+(now-wall0)/1000*rate;const end=projEnd();
  if(rate>0&&T>=end){T=end;if(exporting){finishExport(false);return;}pause();return;}
  if(rate<0&&T<=0){T=0;pause();return;}
  if(rate>0){syncMedia();renderFrame(T);}else renderStill();
  updPH(true);refreshInsp();
  if(exporting)updExport();
  requestAnimationFrame(tick);
}
function syncMedia(){
  const TL=transList(),act=TL.filter(w=>T>=w.a&&T<w.b);
  for(const c of P.clips){if(!isAV(c))continue;const tr=trackOf(c.track);const[a,b]=winOf(c,TL);const on=T>=a&&T<b;const r=elFor(c);if(!r)continue;const e=r.el;
    if(on&&playing&&rate>0){const m=MEDIA.get(c.media),raw=c.in+(T-c.start)*c.speed,want=srcT(c,T),frozen=raw<0||(m&&raw>m.dur-0.06);
      if(frozen){if(!e.paused)e.pause();if(Math.abs(e.currentTime-want)>0.05)e.currentTime=want;}
      else{const pr=clamp(c.speed*rate,.0625,16);if(Math.abs(e.playbackRate-pr)>1e-3)e.playbackRate=pr;
        if(e.paused){if(Math.abs(e.currentTime-want)>0.04)e.currentTime=want;e.play().catch(()=>{});}else if(Math.abs(e.currentTime-want)>0.3)e.currentTime=want;}
      let tg=1;for(const w of act){const u=clamp((T-w.a)/w.d,0,1);if(w.c===c)tg*=u;if(w.pv===c)tg*=1-u;}
      const core=T>=c.start&&T<c.start+c.dur,lt=clamp(T-c.start,0,c.dur);const vol=(tr&&tr.mute?0:1)*val(c,'volume',lt)*(core?fadeK(c,lt):1)*tg*(rate>1?.5:1);if(r.g)r.g.gain.value=vol;else e.volume=clamp(vol,0,1);}
    else if(!e.paused)e.pause();}
}
function setT(t,keepPlay=true){T=Math.max(0,fr(t));if(playing&&keepPlay){T00=T;wall0=performance.now();syncMedia();}else renderStill();updPH();refreshInsp();}

/* ================= render ================= */
const CV=$('#pv'),X=CV.getContext('2d'),OV=$('#pvov'),OX=OV.getContext('2d');
const FILTER_OK='filter' in X;
const BOUNDS=new Map();
const easeOut=u=>1-Math.pow(1-u,3);
const easeBack=u=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(u-1,3)+c1*Math.pow(u-1,2);};
let LAYA=null,LAYB=null;
function layer(n){let c=n?LAYB:LAYA;if(!c||c.width!==P.w||c.height!==P.h){c=document.createElement('canvas');c.width=P.w;c.height=P.h;if(n)LAYB=c;else LAYA=c;}const x=c.getContext('2d');x.setTransform(1,0,0,1,0,0);x.globalAlpha=1;if(FILTER_OK)x.filter='none';x.clearRect(0,0,P.w,P.h);return c;}
function prevAdj(c){for(const o of P.clips)if(o!==c&&o.track===c.track&&Math.abs(o.start+o.dur-c.start)<1.5/P.fps)return o;return null;}
function transWin(c){if(!c.tin)return null;const pv=prevAdj(c);let d=Math.min(c.tin.dur,c.dur);if(pv){d=Math.min(d,pv.dur*2,c.dur*2);return{c,pv,a:c.start-d/2,b:c.start+d/2,d};}return{c,pv:null,a:c.start,b:c.start+d,d};}
function transList(){const L=[];for(const c of P.clips){const w=transWin(c);if(w&&w.d>0)L.push(w);}return L;}
function winOf(c,TL){let a=c.start,b=c.start+c.dur;for(const w of TL){if(w.c===c)a=Math.min(a,w.a);if(w.pv===c)b=Math.max(b,w.b);}return[a,b];}
function renderFrame(t){
  X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;if(FILTER_OK)X.filter='none';X.fillStyle=P.bg;X.fillRect(0,0,P.w,P.h);BOUNDS.clear();
  const TL=transList(),act=TL.filter(w=>t>=w.a&&t<w.b);
  const vts=P.tracks.filter(tr=>tr.kind==='video');
  for(let i=vts.length-1;i>=0;i--){const tr=vts[i];if(tr.hide)continue;
    const tw=act.filter(w=>w.c.track===tr.id),skip=new Set();tw.forEach(w=>{skip.add(w.c.id);if(w.pv)skip.add(w.pv.id);});
    for(const c of P.clips)if(c.track===tr.id&&!skip.has(c.id)&&t>=c.start&&t<c.start+c.dur)drawClip(c,t,X,false);
    for(const w of tw){const A=layer(0),B=layer(1);if(w.pv)drawClip(w.pv,t,A.getContext('2d'),true);drawClip(w.c,t,B.getContext('2d'),true);X.save();drawTrans(w.c.tin.type,X,A,B,clamp((t-w.a)/w.d,0,1),P.w,P.h);X.restore();}}
  drawOverlay();
}
function drawClip(c,t,ctx=X,inTrans=false){
  const lt=clamp(t-c.start,0,Math.max(0,c.dur-1e-4)),p=c.p;let a=val(c,'opacity',lt)*(inTrans?1:fadeK(c,lt)),sc=val(c,'scale',lt),x=val(c,'x',lt),y=val(c,'y',lt),rot=val(c,'rot',lt);
  const ai=clamp(lt/.45,0,1);
  if(p.anim==='fade')a*=ai;else if(p.anim==='up'){y+=90*(1-easeOut(ai));a*=ai;}else if(p.anim==='pop'){sc*=Math.max(.01,easeBack(ai));a*=Math.min(1,ai*2.5);}
  else if(p.anim==='zoom'){sc*=1+.35*(1-easeOut(ai));a*=ai;}else if(p.anim==='left'){x-=P.w*.6*(1-easeOut(ai));}
  if(a<=.002||sc<=0)return;
  let src=null,sw=P.w,sh=P.h;
  if(c.type==='video'){const r=elFor(c);if(!r||r.el.readyState<2||!r.el.videoWidth)return;src=r.el;sw=src.videoWidth;sh=src.videoHeight;}
  else if(c.type==='image'){const m=MEDIA.get(c.media);if(!m||!m.img||!m.img.complete||!m.img.naturalWidth)return;src=m.img;sw=m.w;sh=m.h;}
  else if(c.type==='model'){src=renderModel(c,lt);if(!src)return;}
  let dw=P.w,dh=P.h;if(src&&c.type!=='model'){const k=Math.min(P.w/sw,P.h/sh);dw=sw*k;dh=sh*k;}
  ctx.save();ctx.globalAlpha=clamp(a,0,1);ctx.translate(P.w/2+x,P.h/2+y);ctx.rotate(rot*D2R);ctx.scale(sc,sc);

async function addMedia(file){

const PRIMS=[['knot','Узел'],['cube','Куб'],['sphere','Шар'],['torus','Тор'],['gem','Кристалл'],['cone','Конус'],['cylinder','Цилиндр']];
function primGeo(T3,k){switch(k){case 'cube':return new T3.BoxGeometry(1,1,1);case 'sphere':return new T3.SphereGeometry(.6,64,32);case 'torus':return new T3.TorusGeometry(.5,.2,48,128);case 'cone':return new T3.ConeGeometry(.5,1,64);case 'gem':return new T3.IcosahedronGeometry(.6,0);case 'cylinder':return new T3.CylinderGeometry(.45,.45,1,64);default:return new T3.TorusKnotGeometry(.45,.15,220,32);}}
function modelFor(c){
  const key=c.media||('prim:'+(c.p.prim||'knot'));let s=MODELS.get(c.id);if(s&&s.key===key)return s;
  if(!window.THREE||!window.THREE.GLTFLoader){loadThree().then(()=>{if(!playing)renderStill();if(SEL.has(c.id))renderInspector();}).catch(()=>{if(!threeWarned){threeWarned=true;toast('Не удалось загрузить 3D-движок. Для 3D нужен интернет при первом запуске',6000);}});return null;}
  const T3=window.THREE,R=r3();s={key,ready:false};MODELS.set(c.id,s);
  const scene=new T3.Scene();if(R.env)scene.environment=R.env;s.hemi=new T3.HemisphereLight(0xffffff,0x3a3f48,.9);scene.add(s.hemi);s.dl=new T3.DirectionalLight(0xffffff,1.6);s.dl.position.set(3,5,4);scene.add(s.dl);
  s.cam=new T3.PerspectiveCamera(35,P.w/P.h,.01,1000);s.pivot=new T3.Group();scene.add(s.pivot);s.scene=scene;
  const finish=(obj,anims)=>{const box=new T3.Box3().setFromObject(obj),size=box.getSize(new T3.Vector3()),ctr=box.getCenter(new T3.Vector3());obj.position.sub(ctr);s.pivot.add(obj);s.radius=Math.max(size.x,size.y,size.z)*.5||1;
    if(anims&&anims.length){s.mixer=new T3.AnimationMixer(obj);s.anims=anims;s.actions=anims.map(a=>s.mixer.clipAction(a));}
    s.ready=true;if(!playing)renderStill();if(SEL.has(c.id))renderInspector();};
  if(c.media){const m=MEDIA.get(c.media);if(!m){s.error=true;return s;}m.blob.arrayBuffer().then(buf=>new Promise((res,rej)=>new T3.GLTFLoader().parse(buf,'',res,rej))).then(g=>finish(g.scene,g.animations)).catch(()=>{s.error=true;toast('Не получилось открыть 3D-модель. Нужен файл .glb (без Draco-сжатия) или .gltf со встроенными текстурами',6000);});}
  else{const k=c.p.prim||'knot';s.mat=new T3.MeshStandardMaterial({color:c.p.mcolor,metalness:c.p.metal,roughness:c.p.rough,flatShading:k==='gem'});finish(new T3.Mesh(primGeo(T3,k),s.mat),null);}
  return s;}
function renderModel(c,lt){const s=modelFor(c);if(!s||!s.ready)return null;const R=r3(),p=c.p;
  if(R.w!==P.w||R.h!==P.h){R.renderer.setSize(P.w,P.h,false);R.w=P.w;R.h=P.h;}
  const d=s.radius/Math.tan(17.5*D2R)*1.2*val(c,'dist',lt);s.cam.aspect=P.w/P.h;s.cam.near=d/100;s.cam.far=d*100;s.cam.position.set(0,0,d);s.cam.lookAt(0,0,0);s.cam.updateProjectionMatrix();
  s.pivot.rotation.set(val(c,'rx',lt)*D2R,(val(c,'ry',lt)+p.spin*lt)*D2R,0);
  s.hemi.intensity=.9*p.light;s.dl.intensity=1.6*p.light;
  if(s.mat){s.mat.color.set(p.mcolor);s.mat.metalness=p.metal;s.mat.roughness=p.rough;}
  if(s.mixer){const idx=p.animIdx|0;s.actions.forEach((a,i)=>{if(p.animOn&&i===idx){a.enabled=true;a.play();}else a.stop();});s.mixer.setTime(p.animOn?lt:0);}
  R.renderer.render(s.scene,s.cam);return R.renderer.domElement;}
function addPrim(k='knot'){if(P.demo)clearDemo();const t=T,tid=freeTrack('video',t,t+6,false);const c=makeClip('model',tid,t,6);c.p.prim=k;c.name='3D: '+PRIMS.find(q=>q[0]===k)[1].toLowerCase();P.clips.push(c);SEL.clear();SEL.add(c.id);snap('3D-фигура');renderTimeline();onSel(true);setT(c.start+.8,false);loadThree().catch(()=>{});}
function modelSection(box,c){
  box.append(el('h3',{text:'3D'}));
  if(!c.media){selRow(box,'Фигура',PRIMS,c.p.prim||'knot',v=>{c.p.prim=v;c.name='3D: '+PRIMS.find(q=>q[0]===v)[1].toLowerCase();snap('3D-фигура');renderTimeline();afterEdit();});
    colorRow(box,'Цвет',c,'mcolor');numRow(box,c,'metal','Металл',0,1,.01,false);numRow(box,c,'rough','Матовость',0,1,.01,false);}
  numRow(box,c,'ry','Поворот',-360,360,1,true);numRow(box,c,'rx','Наклон',-180,180,1,true);numRow(box,c,'dist','Отдаление',.3,4,.01,true);numRow(box,c,'spin','Вращение °/с',-360,360,1,false);numRow(box,c,'light','Свет',0,3,.01,false);
  const s=MODELS.get(c.id);
  if(s&&s.anims&&s.anims.length){chkRow(box,'Встроенная анимация модели',c,'animOn');selRow(box,'Какая',s.anims.map((a,i)=>[String(i),a.name||('Анимация '+(i+1))]),c.p.animIdx|0,v=>{c.p.animIdx=+v;afterEdit();snap('Анимация модели');});}
  else if(!s||!s.ready)box.append(el('p',{class:'note',text:s&&s.error?'Модель не открылась.':'3D загружается… (в первый раз нужен интернет)'}));
  box.append(el('p',{class:'note',text:'Поворот, наклон и отдаление можно анимировать ключами ◆. 3D — обычный слой: к нему работают положение, масштаб, прозрачность, цвет и переходы.'}));
}
async function prepareAssets(){
  const fs=new Set(P.clips.filter(c=>c.type==='text').map(c=>c.p.font));await Promise.all([...fs].map(ensureFont));
  if(P.clips.some(c=>c.type==='model')){try{await loadThree();}catch(e){return;}for(const c of P.clips)if(c.type==='model')modelFor(c);const t0=Date.now();
    while(P.clips.some(c=>{if(c.type!=='model')return false;const s=MODELS.get(c.id);return!s||(!s.ready&&!s.error);})&&Date.now()-t0<15000)await sleep(100);}
}

/* ================= boot ================= */
function renderAll(){applyFormat(false);renderTimeline();renderInspector();renderStill();updPH();}
function demo(){
  P.tracks=defTracks();P.clips=[];P.demo=true;
  const bg=makeClip('solid','v1',0,8);bg.name='Фон';bg.kf.scale=[[0,1],[8,1.25]];bg.kf.rot=[[0,0],[8,6]];
  const t1=makeClip('text','v2',.4,4.2);Object.assign(t1.p,{text:'Склейка',font:'Unbounded',size:190,outline:false,anim:'pop',y:-60});t1.p.fadeOut=.5;t1.name='Заголовок';
  const t2=makeClip('text','v3',1.6,5.6);Object.assign(t2.p,{text:'смонтируй свой первый ролик',size:64,bold:false,outline:false,anim:'type',y:110,color:'#d8f3f2'});t2.name='Подзаголовок';
  const t3=makeClip('text','v2',5,3);Object.assign(t3.p,{text:'Перетащи сюда видео — пример исчезнет',size:52,bold:false,outline:false,bg:true,bga:.5,anim:'up',y:330});t3.name='Подсказка';
  P.clips.push(bg,t1,t2,t3);
}
async function boot(){
  buildMenus();P.tracks=defTracks();buildTransTiles();buildFontCats();await restoreFonts();
  let restored=false;
  try{const pr=await idbGet('kv','project');if(pr&&pr.P){const o=JSON.parse(pr.P);if(o.clips&&o.clips.length&&!o.demo){const ms=await idbAll('media');for(const r of ms){const m={...r,url:URL.createObjectURL(r.blob)};if(m.kind==='image'){m.img=new Image();m.img.src=m.url;}MEDIA.set(m.id,m);}Object.assign(P,o);restored=true;}}}catch(e){}
  if(!restored){demo();T=1.4;}
  snap(restored?'Проект восстановлен':'Пример');
  applyFormat(false);renderBin();
  requestAnimationFrame(()=>{layoutPreview();zoomFit();renderAll();});
  await document.fonts.ready.catch(()=>{});renderStill();
  toast(restored?'Восстановлен прошлый проект. Начать заново — Файл › Новый проект':'Это пример. Перетащите своё видео в окно или нажмите «Импорт». Пробел — воспроизвести, F1 — все клавиши',7000);
}
new ResizeObserver(()=>{layoutPreview();drawRuler();}).observe($('#pvbox'));
new ResizeObserver(()=>{if(!tdrag)renderTimeline();}).observe(sc);
boot();
})();
